version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: asyncflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asyncflow
      POSTGRES_PASSWORD: asyncflow_secure_password_2026
      POSTGRES_DB: asyncflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncflow -d asyncflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: asyncflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asyncflow-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://asyncflow:asyncflow_secure_password_2026@postgres:5432/asyncflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_SECRET_KEY: production_app_secret_key_asyncflow
      LOCAL_STORAGE_PATH: /storage/results
    volumes:
      - storage_data:/storage/results
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asyncflow-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=INFO -Q reports,data_processing,maintenance,default -c 4
    environment:
      DATABASE_URL: postgresql+psycopg://asyncflow:asyncflow_secure_password_2026@postgres:5432/asyncflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LOCAL_STORAGE_PATH: /storage/results
    volumes:
      - storage_data:/storage/results
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: asyncflow-scheduler
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://asyncflow:asyncflow_secure_password_2026@postgres:5432/asyncflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asyncflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  storage_data:
